name: AI4U Router Quality Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Billing, security and mission regression suite
        run: npm test
      - name: Routing reference and challenge evaluations
        run: |
          for f in baseline holdout stress challenge; do
            node scripts/evaluate-routing.js --fixture="$f" > "routing-evaluation-$f.json"
          done
          node - <<'NODE'
          const floors={baseline:[30,30],holdout:[40,40],stress:[20,20],challenge:[20,17]};
          for(const [fixture,[count,floor]] of Object.entries(floors)){
            const result=require("./routing-evaluation-"+fixture+".json");
            if(result.cases!==count||result.error_count!==0||result.agreement_count<floor){
              throw Error(fixture+" regression: "+result.agreement_count+"/"+result.cases);
            }
          }
          NODE
      - name: Preserve quality proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-quality-proof
          path: |
            routing-evaluation-*.json
            evals/baseline-2026-11-11.json
            evals/routing-v2-*.json
          retention-days: 90
