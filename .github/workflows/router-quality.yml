name: AI4U Router Quality Gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Billing, security and mission regression suite
        run: npm test
      - name: Routing reference evaluation
        run: |
          node scripts/evaluate-routing.js > routing-evaluation.json
          node -e 'const x=require("./routing-evaluation.json");if(x.cases!==30||x.error_count!==0||x.agreement_count<20)process.exit(1);'
      - name: Preserve quality proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: router-quality-proof
          path: |
            routing-evaluation.json
            evals/baseline-2026-11-11.json
          retention-days: 90
